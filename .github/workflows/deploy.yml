name: Deploy

on:
  push:
    branches:
      - main
      - 'ccr-*'
      # Experiments: published ONLY to /exp/<name>/ (never the site root).
      - 'exp-*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Typechecks the site and the online server (tsc -p server).
      - run: npm run typecheck
      - run: npm test

      - name: Compute build id
        id: build
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${GITHUB_REF_NAME}@${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          # Online server base URL (repo variable; empty = the default in src/net/client.ts).
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

      - name: Deploy branch build to site root
        if: github.ref_type != 'tag' && !startsWith(github.ref_name, 'exp-')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: |
            v/**
            exp/**

      # Also keep a frozen copy per package.json version (git tags can't be
      # pushed from the dev environment). Bump the version to freeze a phase.
      - name: Deploy branch build to v/<package version>/
        if: github.ref_type != 'tag' && !startsWith(github.ref_name, 'exp-')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: v/${{ steps.build.outputs.version }}

      - name: Deploy experiment branch to exp/<name>/
        if: github.ref_type != 'tag' && startsWith(github.ref_name, 'exp-')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: exp/${{ github.ref_name }}

      - name: Deploy tagged build to v/<tag>/
        if: github.ref_type == 'tag'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: v/${{ github.ref_name }}

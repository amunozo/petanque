name: Deploy server

# Typechecks/tests the online server and deploys the Cloudflare Worker when the
# server or the shared game code it bundles changes. Without the
# CLOUDFLARE_API_TOKEN secret the deploy step is skipped (the job still passes).
on:
  push:
    branches:
      - main
      - 'ccr-*'
    paths:
      - 'server/**'
      - 'src/net/**'
      - 'src/engine/**'
      - 'src/games/**'
      # The default config is the server's referee config (and its fingerprint).
      - 'src/tuning/config.ts'
      - 'src/tuning/paths.ts'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  check-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: server

      # Root typecheck covers the site AND the server (tsc -p server).
      - run: npm run typecheck
      - run: npx vitest run src/net src/engine src/games

      - name: Bundle check (no upload)
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: server

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: server

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set; server not deployed (see server/README.md)."

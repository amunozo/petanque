<!doctype html>
<!--
  CrazyGames loader: the whole upload. It shows the live site full-size, so every deploy of
  petanque.amunozo.com updates the CrazyGames version too (one copy of the game: no version drift
  with the online server). ?portal=crazygames turns on portal mode (src/app/portal.ts).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pétanque</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe src="https://petanque.amunozo.com/?portal=crazygames" title="Pétanque"
        allow="autoplay; fullscreen; clipboard-write; web-share; gamepad; vibrate" allowfullscreen></iframe>
</body>
</html>
